name: Deploy docs to Pages

# Builds the Jekyll + Just the Docs site (site/, _config.yml, _includes/) and
# publishes it via GitHub Pages' Actions-based deployment. Independent of the
# worker's own CI (.github/workflows/ci.yml) -- a docs-only change shouldn't
# need Redis or Node, and a code change shouldn't need Ruby.
#
# One-time manual step this workflow cannot do for you: in the repo's
# Settings -> Pages, set "Build and deployment" -> Source to "GitHub Actions".
# Until that's set, this workflow's deploy job will fail with a permissions
# error even though the build succeeds.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "_includes/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "README.md"
      - "FINDINGS.md"
      - "MUTATIONS.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
