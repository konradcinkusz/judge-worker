name: Deploy docs to Pages

# Builds the Jekyll + Just the Docs site (site/, _config.yml, _includes/) and
# publishes it via GitHub Pages' Actions-based deployment. Independent of the
# worker's own CI (.github/workflows/ci.yml) -- a docs-only change shouldn't
# need Redis or Node, and a code change shouldn't need Ruby.
#
# This workflow enables Pages itself (`enablement: true` on configure-pages),
# so no manual Settings step is required -- the `pages: write` permission below
# is what lets it create the Pages site on the first run. The earlier version of
# this file asserted the opposite and left the setup to a human; every one of the
# four merges to main this workflow ran on failed at "Setup Pages" with
# `Get Pages site failed ... Not Found` before that assumption was checked
# against the action's own inputs.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "_includes/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "README.md"
      - "FINDINGS.md"
      - "MUTATIONS.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet, rather than failing on a
          # lookup. Idempotent: a no-op once the site exists, so this stays correct
          # whether or not anyone has touched Settings -> Pages.
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
