name: Deploy docs to Pages

# Builds the Jekyll + Just the Docs site (site/, _config.yml, _includes/) and
# publishes it via GitHub Pages' Actions-based deployment. Independent of the
# worker's own CI (.github/workflows/ci.yml) -- a docs-only change shouldn't
# need Redis or Node, and a code change shouldn't need Ruby.
#
# SETUP: Pages must be enabled once by a human, in Settings -> Pages ->
# "Build and deployment" -> Source -> "GitHub Actions". Until that is done every
# run dies at "Setup Pages" and the deploy job is skipped -- which is what the
# first five runs of this workflow did.
#
# `enablement: true` below asks configure-pages to create the site itself. That
# is worth keeping (it is idempotent, and it makes the failure legible), but it
# does NOT remove the manual step here: GITHUB_TOKEN is refused the create call
# with `Create Pages site failed. Error: Resource not accessible by integration`
# even though this job declares `pages: write`. Creating a Pages site needs a
# user or a PAT, not the workflow token. Once the site exists, this step is a
# no-op and the workflow is fully automatic from then on.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "_includes/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "README.md"
      - "FINDINGS.md"
      - "MUTATIONS.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Create the Pages site if it does not exist yet, rather than only looking it
          # up. Idempotent once the site exists. Note this cannot bootstrap Pages on its
          # own here -- see the SETUP note at the top of this file -- but it turns an
          # opaque "Not Found" into an explicit "Create Pages site failed", which is the
          # difference between a five-run mystery and a one-line answer.
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
