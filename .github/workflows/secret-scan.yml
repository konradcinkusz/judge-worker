name: Secret Scan

# Scans full git history, not just the tip commit -- a secret added and then removed in an
# earlier commit of the same branch would otherwise pass, which is exactly the case this job
# exists to catch (the secret is still in history even after the file is "fixed"). Runs on
# every PR/push and weekly, since gitleaks' upstream rule set changes independently of this
# codebase: a commit clean in one scan can become a finding after a later rule update.
#
# No pre-commit hook yet -- this repo doesn't have local git-hooks infrastructure set up. CI
# alone still catches everything before it reaches a merged main.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 05:30 UTC -- before the Dependabot batch, so a rule-set change that turns an
    # old commit into a finding isn't confused with a dependency bump.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"

          # gitleaks renamed `detect` to `git` in v8.19 and kept the old name as a deprecated
          # alias. Probe instead of assuming, so a scanner upgrade doesn't turn this job red
          # for the wrong reason.
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            "${SUB[@]}" \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo
            echo "1. **Rotate the credential.** Now, before anything else."
            echo "2. Remove it from the source; read it from the environment instead"
            echo "   (see \`.env.example\` for the documented variable set)."
            echo "3. Only then clean history."
            echo
            echo "Scrubbing without rotating is theatre."
            echo
            echo "If this is a false positive, add a **narrow** allowlist entry to"
            echo "\`.gitleaks.toml\` with a comment saying why. Never allowlist a finding by"
            echo "pasting the real value into a regex."
          } >> "$GITHUB_STEP_SUMMARY"
