services:
  redis:
    image: redis:7-alpine
    container_name: judge-worker-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - judge-worker-redis-data:/data

volumes:
  judge-worker-redis-data:
